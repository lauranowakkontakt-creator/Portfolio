<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laura Nowak | Operator Kamery & Montażysta Wideo</title>
    <meta name="description" content="Laura Nowak — operator kamery i montażysta wideo. Gliwice & Śląsk. DaVinci Resolve Studio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="ambient-canvas"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="light-leaks"></div>
    <div id="film-grain"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById('ambient-canvas')
        const ctx = canvas.getContext('2d')

        function resize() {
          canvas.width = window.innerWidth
          canvas.height = window.innerHeight
        }
        resize()
        window.addEventListener('resize', resize)

        const particles = Array.from({ length: 90 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.8 + 0.3,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          opacity: Math.random() * 0.5 + 0.1,
          pulse: Math.random() * Math.PI * 2,
        }))

        const glows = [
          { x: 0.10, y: 0.20, r: 320, vx: 0.08,  vy: 0.05,  phase: 0,   color: '201,75,40' },
          { x: 0.85, y: 0.70, r: 380, vx: -0.07, vy: 0.06,  phase: 2.1, color: '224,94,56' },
          { x: 0.50, y: 0.45, r: 460, vx: 0.04,  vy: -0.05, phase: 4.2, color: '201,75,40' },
          { x: 0.30, y: 0.85, r: 280, vx: -0.05, vy: -0.04, phase: 1.0, color: '60,90,160' },
          { x: 0.75, y: 0.15, r: 240, vx: 0.06,  vy: 0.03,  phase: 3.4, color: '224,94,56' },
          { x: 0.20, y: 0.60, r: 200, vx: 0.07,  vy: -0.06, phase: 5.0, color: '80,40,120' },
        ].map(g => ({ ...g, x: g.x * window.innerWidth, y: g.y * window.innerHeight }))

        let sweep = -200

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height)

          sweep += 0.6
          if (sweep > canvas.width + 300) sweep = -300
          const flare = ctx.createLinearGradient(sweep - 80, 0, sweep + 80, 0)
          flare.addColorStop(0, 'rgba(201,75,40,0)')
          flare.addColorStop(0.5, 'rgba(224,94,56,0.12)')
          flare.addColorStop(1, 'rgba(201,75,40,0)')
          ctx.fillStyle = flare
          ctx.fillRect(sweep - 80, 0, 160, canvas.height)

          glows.forEach(g => {
            g.x += g.vx; g.y += g.vy; g.phase += 0.003
            if (g.x < -g.r) g.x = canvas.width + g.r
            if (g.x > canvas.width + g.r) g.x = -g.r
            if (g.y < -g.r) g.y = canvas.height + g.r
            if (g.y > canvas.height + g.r) g.y = -g.r
            const a = 0.10 + Math.sin(g.phase) * 0.04
            const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r)
            grad.addColorStop(0, `rgba(${g.color},${a})`)
            grad.addColorStop(1, `rgba(${g.color},0)`)
            ctx.fillStyle = grad
            ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill()
          })

          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.pulse += 0.012
            if (p.x < 0) p.x = canvas.width
            if (p.x > canvas.width) p.x = 0
            if (p.y < 0) p.y = canvas.height
            if (p.y > canvas.height) p.y = 0
            const a = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse))
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
            ctx.fillStyle = `rgba(237,234,229,${a})`; ctx.fill()
          })

          requestAnimationFrame(draw)
        }
        draw()
      })()
    </script>
  </body>
</html>
